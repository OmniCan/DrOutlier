---
deployment:
  tasks:
    # Install Laravel backend dependencies
    - export DEPLOYPATH=/home/USERNAME/public_html/
    - /bin/cp -R admin $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R src $DEPLOYPATH
    - /bin/cp -R frontend $DEPLOYPATH
    - /bin/cp *.md $DEPLOYPATH
    - /bin/cp *.json $DEPLOYPATH
    - /bin/cp *.sql $DEPLOYPATH 2>/dev/null || :
    
    # Laravel Setup
    - cd $DEPLOYPATH/admin/application
    - /usr/bin/composer install --no-dev --optimize-autoloader
    - /usr/bin/php artisan config:cache
    - /usr/bin/php artisan route:cache
    - /usr/bin/php artisan view:cache
    - chmod -R 755 storage bootstrap/cache
    
    # Frontend Setup (if deploying separately)
    - cd $DEPLOYPATH/frontend
    - /usr/bin/composer install --no-dev --optimize-autoloader
    - chmod -R 755 storage
